<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WILD RUSSIA · 野性俄罗斯</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#f5c451;--red:#c8102e;--paper:#f6ead2;--ink:#2a1a12;--cn:"Noto Serif SC","Songti SC","STSong","SimSun",serif;--hd:"Playfair Display",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#1a0508;color:#fff;font-family:Georgia,"Times New Roman",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.slide{position:absolute;inset:0;z-index:1;visibility:hidden;transition:visibility 0s 1.1s;background:radial-gradient(ellipse at 50% 0%,var(--b2),var(--b1) 75%);overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:8vh 12vw 12vh 8vw}
.slide.active{visibility:visible;z-index:2;transition-delay:0s;animation:moon 1.1s cubic-bezier(.7,0,.2,1)}
@keyframes moon{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(150% at 50% 50%)}}
.frame{position:absolute;inset:2.2vh 1.6vw;border:2px solid var(--gold);box-shadow:inset 0 0 0 6px transparent,inset 0 0 0 7px rgba(245,196,81,.45);pointer-events:none;z-index:4}
.frame::before,.frame::after{content:"";position:absolute;width:26px;height:26px;border:4px solid var(--gold)}
.frame::before{top:-4px;left:-4px;border-right:0;border-bottom:0}.frame::after{bottom:-4px;right:-4px;border-left:0;border-top:0}
.mt{position:absolute;left:0;right:0;bottom:0;height:42vh;pointer-events:none}
.mt svg{position:absolute;bottom:0;width:120%;height:100%}
.m1{opacity:.18;animation:drift 40s ease-in-out infinite alternate}.m2{opacity:.3;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translateX(-8%)}}
.cloud{position:absolute;height:34px;width:150px;background:rgba(245,196,81,.12);border-radius:40px;filter:blur(2px);animation:cl 40s linear infinite}
.cloud::before{content:"";position:absolute;left:25px;top:-16px;width:70px;height:50px;border-radius:50%;background:inherit}
@keyframes cl{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}
.lt{position:absolute;top:-10px;z-index:5;width:clamp(44px,6vw,84px);transform-origin:50% 0;animation:sw 4s ease-in-out infinite alternate}
.lt::before{content:"";display:block;width:2px;height:6vh;background:var(--gold);margin:0 auto}
.lt i{display:block;height:clamp(52px,7vw,96px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a5a,var(--red) 55%,#7a0016);box-shadow:0 0 40px 8px rgba(255,60,60,.55);position:relative;animation:gl 2.5s ease-in-out infinite alternate}
.lt i::before,.lt i::after{content:"";position:absolute;left:25%;width:50%;height:9px;background:var(--gold);border-radius:3px}
.lt i::before{top:-3px}.lt i::after{bottom:-3px}
.lt b{display:block;width:3px;height:5vh;margin:3px auto 0;background:var(--gold);box-shadow:-5px 0 0 var(--gold),5px 0 0 var(--gold)}
@keyframes sw{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}@keyframes gl{to{box-shadow:0 0 60px 16px rgba(255,90,60,.75)}}
.cn{position:absolute;right:5vw;top:11vh;writing-mode:vertical-rl;font:900 clamp(64px,13vw,190px)/1.05 var(--cn);color:var(--gold);opacity:0;letter-spacing:.05em;text-shadow:0 0 40px rgba(245,196,81,.5);z-index:1}
.active .cn{animation:ink 1.6s .4s ease-out forwards}
@keyframes ink{from{opacity:0;filter:blur(20px);transform:translateY(-40px)}to{opacity:.3;filter:none;transform:none}}
.seal{position:absolute;right:5vw;bottom:13vh;width:clamp(56px,7vw,92px);height:clamp(56px,7vw,92px);background:var(--red);color:#ffe9c0;font:900 clamp(34px,4.6vw,62px)/1 var(--cn);display:flex;align-items:center;justify-content:center;border:3px solid #ffe9c0;border-radius:6px;box-shadow:0 0 0 3px var(--red);opacity:0;z-index:5}
.active .seal{animation:stamp .5s 1.3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{from{opacity:0;transform:scale(3) rotate(-18deg)}to{opacity:.95;transform:rotate(-6deg)}}
.c{position:relative;z-index:6;opacity:0}
.active .c{animation:rise .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(.5s + var(--k)*.12s)}
@keyframes rise{from{opacity:0;transform:translateY(40px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.tag{font:700 clamp(12px,1.4vw,17px) var(--cn);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.ru{display:block;color:#e9d7b6;opacity:.8;font:400 .82em Georgia,serif;font-style:italic;letter-spacing:normal;text-transform:none;margin-top:.2em}
h2{font:900 clamp(40px,8.6vw,124px)/1 var(--hd);color:var(--gold);text-shadow:0 4px 0 #7a0c14,0 0 36px rgba(245,196,81,.45);margin:.1em 0 0;text-transform:uppercase}
.rh{font:700 clamp(16px,2.4vw,32px) var(--cn);letter-spacing:.2em;color:#ffe9c0;margin-bottom:1.6vh}
.lead{font-size:clamp(14px,1.9vw,24px);max-width:48ch;line-height:1.45;margin-bottom:2.6vh;color:#fff4dc}
.stats{display:flex;flex-wrap:wrap;gap:3vw;margin-bottom:2.6vh}
.stats div{border-top:3px solid var(--gold);padding-top:8px}
.stats b{display:block;font:900 clamp(38px,6.4vw,88px)/1 var(--hd);color:var(--gold)}
.stats small{font:700 clamp(10px,1.2vw,15px) var(--cn);letter-spacing:.14em;color:#ffe9c0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:1.6vw;max-width:1000px}
.card{background:linear-gradient(var(--paper),#ecd9b2);color:var(--ink);border:2px solid var(--gold);border-top:8px solid var(--red);padding:1.8vh 1.2vw;box-shadow:0 10px 30px rgba(0,0,0,.5);transform-origin:top;opacity:0;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-8px) rotate(-1deg)!important;box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 24px rgba(245,196,81,.6)}
.active .card{animation:unroll .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(1s + var(--i)*.18s)}
@keyframes unroll{from{opacity:0;transform:scaleY(0) translateY(-20px)}to{opacity:1;transform:none}}
.em{font-size:clamp(38px,5.4vw,70px);display:block;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.card h3{font:900 clamp(15px,1.8vw,23px) var(--hd);color:#8e0a1e;text-transform:uppercase;margin-top:.2em}
.card .ru{color:#6b5436}
.card u{display:inline-block;text-decoration:none;background:var(--red);color:#ffe9c0;font:700 clamp(9px,1vw,12px) var(--cn);letter-spacing:.1em;padding:3px 8px;margin:.55em 0;text-transform:uppercase}
.card p{font-size:clamp(12px,1.3vw,16px);line-height:1.35}
.nav{position:fixed;bottom:3.4vh;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--red);color:var(--gold);font-size:22px;cursor:pointer;box-shadow:0 0 16px rgba(200,16,46,.7)}
.nav button:hover{background:var(--gold);color:var(--red)}
.dots{display:flex;gap:10px}.dots i{width:12px;height:12px;transform:rotate(45deg);border:2px solid var(--gold);cursor:pointer;transition:.3s}.dots i.on{background:var(--gold);box-shadow:0 0 14px var(--gold);transform:rotate(45deg) scale(1.3)}
.hint{position:fixed;top:3.4vh;left:50%;transform:translateX(-50%);z-index:10;color:#e9d7b6;font:12px Georgia,serif;letter-spacing:.15em;opacity:.7;padding-top:env(safe-area-inset-top,0px)}
@media(max-width:700px){.slide{overflow-y:auto;padding:12vh 6vw 16vh}.cn{opacity:.12!important}.lt:nth-of-type(2){display:none}}
</style>
</head>
